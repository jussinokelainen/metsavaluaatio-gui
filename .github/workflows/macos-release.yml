
name: Build macOS Application

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install cmake sqlite

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Metal Toolchain
        run: |
          xcrun -sdk macosx metal --version

      - name: Build application
        run: |
          cargo build --release --bin metsaval-gui

      - name: Create application bundle
        run: |
          APP="Metsavaluaatio.app"

          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp target/release/metsaval-gui \
            "$APP/Contents/MacOS/metsaval-gui"

          chmod +x "$APP/Contents/MacOS/metsaval-gui"

          VERSION="$GITHUB_REF_NAME"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>metsaval-gui</string>
              <key>CFBundleIdentifier</key>
              <string>fi.jussinokelainen.metsavaluaatio</string>
              <key>CFBundleName</key>
              <string>Metsävaluaatio</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>$VERSION</string>
              <key>CFBundleShortVersionString</key>
              <string>$VERSION</string>
          </dict>
          </plist>
          EOF

      - name: Package application
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            Metsavaluaatio.app \
            Metsavaluaatio-macos.app.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          asset="Metsavaluaatio-macos.app.zip"

          for attempt in 1 2 3 4 5; do
            # A previous attempt may have created the release despite returning an error.
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release upload "$tag" "$asset" --clobber; then
                exit 0
              fi
            else
              if gh release create "$tag" "$asset" --generate-notes; then
                exit 0
              fi
            fi

            if [ "$attempt" -lt 5 ]; then
              delay=$((2 ** attempt))
              echo "Release operation failed; retrying in ${delay}s (attempt $((attempt + 1))/5)"
              sleep "$delay"
            fi
          done

          echo "Could not create or update release $tag after 5 attempts"
          exit 1
