name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxkbcommon-dev \
          libxkbcommon-x11-dev \
          libwayland-dev \
          libx11-dev \
          libxcb1-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libxcursor-dev
    - name: Build
      run: cargo build --verbose --bin metsaval-gui
    - name: Run tests
      run: cargo test --verbose
    - name: Run GUI interaction tests
      run: cargo test --verbose --features gui-test-support --bin metsaval-gui
