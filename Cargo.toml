[package]
name = "metsaval"
version = "0.1.0"
edition = "2024"

[features]
# Graafinen käyttöliittymä on oletuksena käytössä.
# Pelkän CLI:n voi rakentaa: cargo build --no-default-features
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras"]

[dependencies]
color-eyre = "0.6.5"
geo = "0.33.1"
proj = "0.31.0"
reqwest = {version = "0.13.5", features = ["json", "query"]}
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
geojson = "1.0.0"
minidom = "0.19.0"
rusqlite = "0.37"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
rust_xlsxwriter = "0.99"
toml = "1.1.8"
quick-xml = "0.42.0"
chrono = "0.4.45"
rand = "0.10.3"
dirs = "7.0.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Graafinen käyttöliittymä (metsaval-gui)
eframe = { version = "0.37.0", optional = true, default-features = false, features = [
    "glow",
    "x11",
    "wayland",
    "default_fonts",
    "system_fonts",
    "links",
] }
egui_extras = { version = "0.37.0", optional = true, default-features = false }

[[bin]]
name = "metsaval"
path = "src/main.rs"

[[bin]]
name = "metsaval-gui"
path = "src/bin/metsaval-gui/main.rs"
required-features = ["gui"]
